<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:Helvetica,Arial,sans-serif;display:flex;flex-wrap:wrap;gap:30px;justify-content:center;padding:24px}
figure{margin:0;text-align:center}figcaption{margin-top:8px;color:#333;font-size:14px}
</style></head><body>
<figure><svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Venture-Pro mark A">
  <!-- A solid sphere with three curved seams, like the lines of latitude on a ball. -->
  <defs><clipPath id="disc"><circle cx="100" cy="100" r="90"/></clipPath></defs>
  <circle cx="100" cy="100" r="90" fill="#000"/>
  <g clip-path="url(#disc)" fill="none" stroke="#fff" stroke-width="10">
    <ellipse cx="100" cy="100" rx="90" ry="34" transform="rotate(-30 100 100)"/>
    <ellipse cx="100" cy="100" rx="90" ry="34" transform="rotate(30 100 100)"/>
    <ellipse cx="100" cy="100" rx="90" ry="34" transform="rotate(90 100 100)"/>
  </g>
</svg>
<figcaption>A. Seams</figcaption></figure>
<figure><svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Venture-Pro mark B">
  <!-- A solid sphere cut by three curved white gaps that meet near the centre. -->
  <circle cx="100" cy="100" r="90" fill="#000"/>
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="butt">
    
  </g>
  <g fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round">
        <path d="M100.0 10.0 C116.9 93.8 116.9 106.2 130.8 184.6"/>
    <path d="M177.9 145.0 C96.9 117.7 86.2 111.6 11.4 84.4"/>
    <path d="M22.1 145.0 C86.2 88.4 96.9 82.3 157.9 31.1"/>
  </g>
</svg>
<figcaption>B. Cut</figcaption></figure>
<figure><svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Venture-Pro mark C">
  <!-- Three equal thick arcs with even breaks between them, turning around one centre. -->
  <g fill="none" stroke="#000" stroke-width="20" stroke-linecap="butt">
        <path d="M100.0 38.0 A62 62 0 0 1 161.1 110.8"/>
    <path d="M153.7 131.0 A62 62 0 0 1 60.1 147.5"/>
    <path d="M46.3 131.0 A62 62 0 0 1 78.8 41.7"/>
  </g>
</svg>
<figcaption>C. Arcs</figcaption></figure>
</body></html>
