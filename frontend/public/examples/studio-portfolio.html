<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Lumen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;700&display=swap">
<style>
:root{--bg:#05070d;--surface:#0d1220;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--accent-text:#05070d;--border:#1f2937;--font-heading:'Space Grotesk', system-ui, sans-serif;--font-body:'Inter', system-ui, sans-serif}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-heading);line-height:1.1;margin:0 0 .5em}
p{margin:0 0 1em}
a{color:inherit}
img,svg{max-width:100%;height:auto;display:block}
.img-slot{display:block;width:100%;aspect-ratio:4/3;background:var(--surface);border:1px dashed var(--border);border-radius:12px}
.top{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:24px 40px}.top b{font-family:var(--font-heading);font-size:18px;color:#fff}.top a{margin-left:22px;font-size:14px;color:#e5e7eb;text-decoration:none}
.hero{position:relative;min-height:520px;display:flex;align-items:flex-end}.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,7,13,.92),rgba(5,7,13,.2))}
.hero-text{position:relative;z-index:1;padding:40px}.hero h1{font-size:clamp(40px,6vw,76px);letter-spacing:-.02em;color:#fff;max-width:820px}.hero p{color:#cbd5e1;font-size:18px;max-width:520px;margin-top:14px}
.btn{display:inline-block;margin-top:24px;background:var(--accent);color:var(--accent-text);padding:14px 26px;border-radius:10px;font-weight:600;text-decoration:none}
.gallery{display:grid;grid-template-columns:1.4fr 1fr;grid-auto-rows:220px;gap:14px;padding:14px}.gallery img{width:100%;height:100%;object-fit:cover;border-radius:12px}.gallery .tall{grid-row:span 2}.gallery .wide{grid-column:span 2}
.foot{padding:28px 40px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}@media(max-width:700px){.gallery{grid-template-columns:1fr;grid-auto-rows:200px}.gallery .tall,.gallery .wide{grid-row:auto;grid-column:auto}.top nav{display:none}}
</style>
</head>
<body>
<header class="top"><b>Studio Lumen</b><nav><a href="#work">Work</a><a href="#contact">Book a shoot</a></nav></header>
<section class="hero"><div class="img-slot" role="img" aria-label="Studio portrait in soft light" data-stock="portrait photographer studio light"></div><div class="hero-text"><h1>Photographs that feel like the moment.</h1><p>Portraits, product and place. An independent studio working with small brands and people who care about light.</p><a class="btn" href="#contact">Book a shoot</a></div></section>
<section class="gallery" id="work"><div class="img-slot" role="img" aria-label="Portrait in natural light" data-stock="natural light portrait woman"></div><div class="img-slot" role="img" aria-label="Product photograph" data-stock="product photography camera lens"></div><div class="img-slot" role="img" aria-label="Interior photograph" data-stock="architecture interior photography"></div></section>
<footer class="foot"><p>Example site made with Venture-Pro. It is not a real business.</p></footer>
</body>
</html>
